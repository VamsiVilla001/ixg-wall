<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · IXG Wall</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%227.446%207.5%2055.108%2044.926%22%20role%3D%22img%22%20aria-label%3D%22IXG%22%3E%3Ctitle%3EIXG%20logo%3C%2Ftitle%3E%3Cstyle%3Epath%7Bfill%3A%23000%7D%40media%20(prefers-color-scheme%3Adark)%7Bpath%7Bfill%3A%23fff%7D%7D%3C%2Fstyle%3E%3Cpath%20d%3D%22M14.8931%207.5H7.44629V15H14.8931V7.5Z%22%2F%3E%3Cpath%20d%3D%22M14.8931%2018.7132H7.44629V41.2132H14.8931V18.7132Z%22%2F%3E%3Cpath%20d%3D%22M62.5538%2044.9265H47.6602V52.4265H62.5538V44.9265Z%22%2F%3E%3Cpath%20d%3D%22M40.2129%2018.7132V41.2132H62.5533V18.7132H40.2129ZM55.1065%2033.7132H47.6597V26.2132H55.1065V33.7132Z%22%2F%3E%3Cpath%20d%3D%22M27.553%2024.66L21.6485%2018.7132H16.3828V24.0165L22.2874%2029.9632L16.3828%2035.91V41.2132H21.6485C22.5972%2040.2577%2026.687%2036.1387%2027.553%2035.2665C28.4191%2036.1387%2032.5089%2040.2577%2033.4576%2041.2132H38.7232V35.91L32.8187%2029.9632L38.7232%2024.0165V18.7132H33.4576L27.553%2024.66Z%22%2F%3E%3C%2Fsvg%3E">
  <link rel="stylesheet" href="/style.css">
  <style>
    /* Sign-in only: everything else comes from the wall's stylesheet (IXG Design System). */
    .signin { flex: 1; display: grid; place-items: center; padding: 16px; overflow: auto; }
    .signin-card {
      width: min(380px, 100%);
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--card);
    }
    .signin-card h1 { margin-top: 6px; font: 500 21px/1.25 var(--font-display); }
    .signin-card .btn { width: 100%; }
    .signin-card .hint { margin: 0; }
    .signin-card .form:not([hidden]) { display: contents; }
    /* Admin / User: a two-way toggle, the selected side filled with ink */
    .role-toggle { display: grid; grid-template-columns: 1fr 1fr; padding: 2px; gap: 2px; border-radius: var(--radius-md); background: var(--secondary); box-shadow: inset 0 0 0 1px var(--border); }
    .role-toggle button { height: 30px; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--muted-foreground); font: 600 10.5px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
    .role-toggle button:hover { color: var(--foreground); }
    .role-toggle button[aria-checked="true"] { background: var(--foreground); color: var(--background); }
    .role-toggle button:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
    #microsoft { display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
    #microsoft[aria-busy="true"] { opacity: .7; pointer-events: none; }
    .ms-logo { flex: none; }
    /* Signed out, or the session ended: a quiet note above the form */
    .note { margin: 0; padding: 8px 10px; border-left: 2px solid var(--muted-foreground); background: var(--secondary); color: var(--foreground); font-size: 12.5px; line-height: 1.5; }
    /* The other ways in, under the main button: plain text links */
    .ways { display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: center; }
    .ways button { padding: 0; border: 0; background: none; color: var(--muted-foreground); font: inherit; font-size: 12px; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
    .ways button:hover { color: var(--foreground); }
    .ways button:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 2px; }
  </style>
</head>
<body>
  <main class="signin">
    <form class="signin-card" id="signin">
      <div>
        <div class="brand"><img class="brand-logo" src="/ixg-logo.svg" alt="IXG"><span class="brand-sub">Wall</span></div>
        <h1 id="title">Sign in to the wall</h1>
      </div>
      <!-- Microsoft 365: the main way in once the admin set it up -->
      <a class="btn btn-accent" id="microsoft" href="/api/auth/microsoft/start" hidden><svg class="ms-logo" viewBox="0 0 21 21" aria-hidden="true" width="16" height="16"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg><span id="microsoft-text">Sign in with Microsoft</span></a>
      <p class="note" id="note" hidden></p>
      <!-- The wall password (an admin) or a user link -->
      <div class="form" id="form" hidden>
        <div class="role-toggle" role="radiogroup" aria-label="Sign in as" id="roles">
          <button type="button" role="radio" id="as-admin" aria-checked="true">Admin</button>
          <button type="button" role="radio" id="as-user" aria-checked="false">User</button>
        </div>
        <label class="field-stack" id="admin-field">
          <span class="telemetry muted">Wall password</span>
          <input class="input" id="password" type="password" name="password" autocomplete="current-password">
        </label>
        <label class="field-stack" id="user-field" hidden>
          <span class="telemetry muted">Your user link</span>
          <input class="input" id="link" type="text" name="link" autocomplete="off" spellcheck="false" placeholder="https://…/join#…">
        </label>
        <button class="btn btn-accent" type="submit" id="submit">Sign in</button>
      </div>
      <p class="form-error" id="error" role="alert" hidden></p>
      <p class="hint" id="hint"></p>
      <div class="ways" id="ways" hidden>
        <button type="button" id="use-password" hidden>Sign in with the wall password</button>
        <button type="button" id="use-link" hidden>Use a user link</button>
        <button type="button" id="use-microsoft" hidden>Sign in with Microsoft instead</button>
      </div>
    </form>
  </main>
  <script>
    (() => {
      'use strict';
      const $ = (id) => document.getElementById(id);
      // Back to the page that sent us here, but only a path on this site.
      const params = new URLSearchParams(location.search);
      const raw = params.get('next') || '/';
      const next = /^\/(?![/\\])/.test(raw) ? raw : '/';
      const HINTS = {
        microsoft: 'Use your organisation\'s Microsoft 365 account. Only accounts an admin has allowed get in, with the role set for them.',
        admin: 'The wall password signs an admin in. This browser stays signed in for 30 days.',
        user: 'Open the link the wall\'s admin shared with you, or paste it here. No password needed.',
      };
      // What's on offer, from the server: Microsoft once the admin set it up, the password
      // unless the admin switched it off. Until the answer comes, the page shows nothing to
      // choose, so the right way in appears first rather than after a flicker.
      let offer = { password: true, microsoft: false };
      let view = null; // 'microsoft' | 'admin' | 'user'
      let role = 'admin';

      function show(v, focus = true) {
        view = v;
        role = v === 'user' ? 'user' : 'admin';
        const form = v !== 'microsoft';
        $('microsoft').hidden = !(v === 'microsoft' && offer.microsoft);
        $('form').hidden = !form;
        // Both toggles only when both the password and a link are ways in.
        $('roles').hidden = !(offer.password && offer.microsoft === false);
        $('as-admin').setAttribute('aria-checked', String(role === 'admin'));
        $('as-user').setAttribute('aria-checked', String(role === 'user'));
        $('admin-field').hidden = role !== 'admin';
        $('user-field').hidden = role !== 'user';
        $('password').required = form && role === 'admin';
        $('link').required = form && role === 'user';
        $('hint').textContent = HINTS[v];
        $('use-password').hidden = !(offer.microsoft && offer.password && v !== 'admin');
        $('use-link').hidden = !(offer.microsoft && v !== 'user');
        $('use-microsoft').hidden = !(offer.microsoft && v !== 'microsoft');
        $('ways').hidden = [...$('ways').children].every((b) => b.hidden);
        clearError();
        if (focus && form) (role === 'admin' ? $('password') : $('link')).focus();
        else if (focus && v === 'microsoft') $('microsoft').focus();
      }

      function clearError() {
        $('error').hidden = true;
        $('password').removeAttribute('aria-invalid');
        $('link').removeAttribute('aria-invalid');
      }

      function fail(msg, input = role === 'admin' ? $('password') : $('link')) {
        $('error').textContent = msg;
        $('error').hidden = false;
        $('submit').disabled = false;
        if (input && !input.closest('[hidden]')) {
          input.setAttribute('aria-invalid', 'true');
          input.select();
        }
      }

      async function signIn() {
        $('submit').disabled = true;
        try {
          const res = await fetch(role === 'admin' ? '/api/login' : '/api/join', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-IXG-Wall': '1' },
            body: JSON.stringify(role === 'admin' ? { password: $('password').value } : { link: $('link').value }),
          });
          if (res.ok) {
            // A link made for one session opens that session (the server says which).
            const body = await res.json().catch(() => ({}));
            const to = typeof body.next === 'string' && /^\/(?![/\\])/.test(body.next) && body.next !== '/' ? body.next : next;
            location.replace(to);
            return;
          }
          const body = await res.json().catch(() => ({}));
          fail(body.error || `Sign-in failed (HTTP ${res.status}).`);
        } catch {
          fail('Can\'t reach the wall server. Check the connection and try again.');
        }
      }

      $('as-admin').addEventListener('click', () => show('admin'));
      $('as-user').addEventListener('click', () => show('user'));
      $('use-password').addEventListener('click', () => show('admin'));
      $('use-link').addEventListener('click', () => show('user'));
      $('use-microsoft').addEventListener('click', () => show('microsoft'));
      $('password').addEventListener('input', clearError);
      $('link').addEventListener('input', clearError);
      $('signin').addEventListener('submit', (e) => {
        e.preventDefault();
        if (view === 'microsoft') return; // Enter on the Microsoft button follows the link itself
        signIn();
      });

      function start() {
        $('microsoft').href = `/api/auth/microsoft/start?next=${encodeURIComponent(next)}`;
        // Going to Microsoft: the button says so until the page leaves.
        $('microsoft').addEventListener('click', () => {
          $('microsoft').setAttribute('aria-busy', 'true');
          $('microsoft-text').textContent = 'Opening Microsoft sign-in…';
          setTimeout(() => { $('microsoft').removeAttribute('aria-busy'); $('microsoft-text').textContent = 'Sign in with Microsoft'; }, 15000);
        });
        // Why we're here: signed out, or a session that ended or was taken away.
        const note = params.get('signedout') ? 'You\'re signed out of the wall. Microsoft may still keep you signed in to other apps in this browser.'
          : params.get('reason') === 'expired' ? 'Your sign-in ended, or your access changed. Sign in again to continue.' : '';
        if (note) {
          $('note').textContent = note;
          $('note').hidden = false;
        }
        // Opened from a user link (/join#token): sign in with it straight away, and take the
        // token out of the address bar and history.
        const token = location.hash.slice(1);
        if (location.pathname === '/join' && token) {
          history.replaceState(null, '', '/join');
          show('user', false);
          $('title').textContent = 'Opening the wall…';
          $('link').value = token;
          signIn().then(() => { $('title').textContent = 'Sign in to the wall'; });
        } else if (location.pathname === '/join') {
          show('user');
        } else {
          show(offer.microsoft ? 'microsoft' : 'admin');
        }
        // A refusal from the Microsoft round trip comes back here with the reason.
        if (params.get('error')) fail(params.get('error'), null);
      }

      fetch('/api/login/options').then((r) => r.json()).then((o) => {
        offer = { password: o.password !== false, microsoft: o.microsoft === true };
      }).catch(() => {}).then(start);
    })();
  </script>
</body>
</html>
